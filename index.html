<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexandria AI • Library Book Recommendation & Navigation System</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="brand" onclick="window.appState.switchTab('map')">
      <div class="brand-icon">🏛️</div>
      <div>
        <div class="brand-title">Alexandria AI</div>
        <div class="brand-subtitle">Library Navigator & Curator</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="map" onclick="window.appState.switchTab('map')">
        <span>🗺️</span> Floor Map & Routing
      </button>
      <button class="tab-btn" data-tab="chat" onclick="window.appState.switchTab('chat')">
        <span>💬</span> Librarian Athena
      </button>
      <button class="tab-btn" data-tab="rag" onclick="window.appState.switchTab('rag')">
        <span>🔍</span> RAG Recommender
      </button>
      <button class="tab-btn" data-tab="comparison" onclick="window.appState.switchTab('comparison')">
        <span>⚖️</span> AI Comparison Studio
      </button>
      <button class="tab-btn" data-tab="graph" onclick="window.appState.switchTab('graph')">
        <span>🕸️</span> Knowledge Graph
      </button>
      <button class="tab-btn" data-tab="catalog" onclick="window.appState.switchTab('catalog')">
        <span>📚</span> Catalog & Stacks
      </button>
    </nav>

    <!-- Quick Actions -->
    <div class="nav-actions">
      <div class="quick-search-box">
        <span>🔍</span>
        <input type="text" id="global-search-input" placeholder="Quick find book or Dewey... (Press /)" 
               onkeydown="if(event.key === 'Enter') window.appState.handleGlobalSearch(this.value)" />
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>A* Mesh Online</span>
      </div>
    </div>
  </header>

  <!-- Main Viewports -->
  <main class="main-content">
    <!-- 1. Interactive Map View -->
    <section id="tab-map" class="tab-pane active"></section>

    <!-- 2. Conversational Librarian Agent Chat -->
    <section id="tab-chat" class="tab-pane"></section>

    <!-- 3. RAG Semantic Recommender -->
    <section id="tab-rag" class="tab-pane"></section>

    <!-- 4. AI Comparison Studio -->
    <section id="tab-comparison" class="tab-pane"></section>

    <!-- 5. Knowledge Graph Explorer -->
    <section id="tab-graph" class="tab-pane"></section>

    <!-- 6. Catalog Browser -->
    <section id="tab-catalog" class="tab-pane"></section>
  </main>

  <!-- Book Detail Modal (Dossier) -->
  <div class="modal-backdrop" id="book-modal-backdrop" onclick="if(event.target === this) window.appState.closeModal()">
    <div class="modal-dialog">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h2 style="font-size:1.35rem; font-weight:800; color:#fff;" id="modal-book-title">Book Title</h2>
          <div style="display:flex; gap:8px; align-items:center; margin-top:6px; font-size:0.85rem;" id="modal-book-meta"></div>
        </div>
        <button class="btn btn-secondary" style="padding:4px 10px; font-size:1rem;" onclick="window.appState.closeModal()">✕</button>
      </div>

      <div>
        <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-dim); font-weight:700; margin-bottom:4px;">
          Synopsis
        </div>
        <p style="font-size:0.88rem; color:#cbd5e1; line-height:1.6;" id="modal-book-synopsis"></p>
      </div>

      <div class="grounded-excerpt-box">
        <div style="font-size:0.72rem; text-transform:uppercase; color:var(--accent-secondary); font-weight:700; margin-bottom:4px;">
          Grounded Excerpt
        </div>
        <div id="modal-book-excerpt"></div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:12px;">
          <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-dim); font-weight:700; margin-bottom:6px;">
            Physical Shelf Coordinates
          </div>
          <div style="font-size:0.82rem; color:#cbd5e1; line-height:1.6;" id="modal-book-location"></div>
        </div>

        <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:12px;">
          <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-dim); font-weight:700; margin-bottom:6px;">
            Cognitive Complexity Profile
          </div>
          <div id="modal-book-metrics"></div>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;" id="modal-book-actions">
        <!-- Action buttons injected -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Component Scripts -->
  <script src="local_engine.js"></script>
  <script src="components/map_view.js"></script>
  <script src="components/librarian_chat.js"></script>
  <script src="components/comparison_view.js"></script>
  <script src="components/rag_view.js"></script>
  <script src="components/graph_view.js"></script>
  <script src="components/catalog_view.js"></script>
  <script src="app.js"></script>
</body>
</html>
